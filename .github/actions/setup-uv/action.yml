name: Set up uv
description: Install the pinned uv release after verifying its checksum

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.13.4"
        # setup-uv@v6 skips verification for releases missing from its built-in checksum list, 0.13.4 included.
        # The checksum is of uv-x86_64-unknown-linux-gnu.tar.gz, so the action works on x86_64 Linux runners only.
        checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
        enable-cache: true
