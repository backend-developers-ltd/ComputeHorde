name: "CD: library"

on:
  push:
    tags: 'library-v*'  # push events to matching v*, i.e. v1.0, v20.15.10

env:
  PYTHON_DEFAULT_VERSION: "3.11"

jobs:
  deploy:
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      id-token: write  # allows publishing to PyPI
      contents: write  # allows uploading a GitHub release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./compute_horde
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      # pip < 26.2.2 vendors a certifi that trusts the compromised eMudhra CAs; the hash pin protects this download.
      - name: Upgrade pip
        run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - name: Install dependencies
        run: python -m pip install --upgrade nox 'pdm==2.19.3'
      - name: Get version from tag
        id: get-version
        run: echo "version=${GITHUB_REF#refs/tags/library-v}" >> "$GITHUB_OUTPUT"
      # - name: Read the Changelog
      #   id: read-changelog
      #   uses: mindsers/changelog-reader-action@v2
      #   with:
      #     version: ${{ steps.get-version.outputs.version }}
      #     path: ./compute_horde/CHANGELOG.md
      - name: Build
        run: pdm build
      - name: Create GitHub release and upload the distribution
        id: create-release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.get-version.outputs.version }}
          body: ${{ steps.read-changelog.outputs.changes }}
          draft: ${{ env.ACTIONS_STEP_DEBUG == 'true' }}
          prerelease: false
          files: ./compute_horde/dist/*
      - name: Upload the distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./compute_horde/dist/
